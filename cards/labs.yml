- title: "Lab 4: Digital Audio"
  path: ../labs/lab4/lab4.qmd
  image: labs/lab4/images/Lab4_Osctrace.jpeg
  image-alt: "Oscilloscope trace of the square-wave notes the microcontroller sends to the speaker amplifier"
  description: "Playing melodies on an STM32L4, using timers to set note frequency and duration."

- title: "Lab 5: Interrupts"
  path: ../labs/lab5/lab5.qmd
  image: labs/lab5/images/Osctrace.jpg
